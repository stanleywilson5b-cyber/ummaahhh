<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ummaahhh 💋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root{
    --blush-50:#fff5f7;
    --blush-100:#ffe4ea;
    --rose-400:#f2739e;
    --rose-500:#e8447d;
    --rose-700:#b22360;
    --berry-800:#6e1743;
    --berry-900:#4a0f2d;
    --gold-300:#f6d48a;
    --cream:#fffaf6;
  }
  :root:not([data-theme="light"]){
    color-scheme: dark light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-app:#2a0d1f;
    }
  }
  :root[data-theme="dark"]{ --bg-app:#2a0d1f; }
  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background: radial-gradient(ellipse at top, #fff0f3 0%, #ffd7e3 45%, #ffb8cf 100%);
    font-family:'Quicksand', ui-sans-serif, system-ui, sans-serif;
    overflow-x:hidden;
  }
  .script{ font-family:'Dancing Script', cursive; }
  #root{ min-height:100vh; width:100%; position:relative; }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--rose-400); border-radius:8px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  button:focus-visible, [tabindex]:focus-visible{
    outline: 3px solid var(--berry-800);
    outline-offset: 3px;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.85; }
    90% { opacity: 0.85; }
    100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
  }
  .floating-heart{
    position:absolute;
    bottom:-10vh;
    animation-name: floatUp;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
    pointer-events:none;
    will-change: transform, opacity;
  }

  @keyframes lidOpen {
    0%{ transform: rotateX(0deg) translateY(0); }
    100%{ transform: rotateX(-115deg) translateY(-18px); }
  }
  .lid-open{
    animation: lidOpen 0.9s cubic-bezier(.34,1.56,.64,1) forwards;
    transform-origin: top center;
  }

  @keyframes popScale {
    0%{ transform: scale(1); }
    35%{ transform: scale(1.18) rotate(-2deg); }
    60%{ transform: scale(0.94) rotate(1deg); }
    100%{ transform: scale(1.04) rotate(0deg); }
  }
  .pop-scale{ animation: popScale 0.6s ease-out forwards; }

  @keyframes waveBar {
    0%, 100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
  }
  .wave-bar{
    animation-name: waveBar;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

  @keyframes gentleBob {
    0%, 100% { transform: translateY(0px) rotate(-1deg); }
    50% { transform: translateY(-14px) rotate(1deg); }
  }
  .gentle-bob{ animation: gentleBob 3.6s ease-in-out infinite; }

  @keyframes sparklePop {
    0%{ transform: scale(0) rotate(0deg); opacity: 1; }
    60%{ transform: scale(1.3) rotate(90deg); opacity: 1; }
    100%{ transform: scale(0.4) rotate(140deg); opacity: 0; }
  }
  .sparkle-pop{ animation: sparklePop 0.7s ease-out forwards; }

  @keyframes fallDown {
    0%{ transform: translateY(0) rotate(0deg); }
    100%{ transform: translateY(112vh) rotate(360deg); }
  }

  @keyframes confettiFall {
    0%{ transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100%{ transform: translateY(110vh) rotate(720deg); opacity: 0.9; }
  }

  @keyframes zoomKiss {
    0%{ transform: scale(0.4); opacity: 0; }
    25%{ opacity: 1; }
    100%{ transform: scale(28); opacity: 1; }
  }
  .zoom-kiss{ animation: zoomKiss 1.9s cubic-bezier(.61,.04,.76,.34) forwards; }

  @keyframes lipPucker {
    0%{ transform: scale(0.35) rotate(-6deg); opacity: 0; }
    35%{ transform: scale(1.18) rotate(3deg); opacity: 1; }
    55%{ transform: scale(0.9) rotate(-2deg); }
    72%{ transform: scale(1.08) rotate(1deg); }
    88%{ transform: scale(0.97); }
    100%{ transform: scale(1) rotate(0deg); opacity: 1; }
  }

  @keyframes fadeIn {
    0%{ opacity: 0; transform: translateY(18px); }
    100%{ opacity: 1; transform: translateY(0); }
  }
  .fade-in{ animation: fadeIn 0.9s ease-out forwards; }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 25px 4px rgba(232,68,125,0.55), 0 0 60px 12px rgba(246,212,138,0.35); }
    50% { box-shadow: 0 0 40px 10px rgba(232,68,125,0.85), 0 0 90px 22px rgba(246,212,138,0.55); }
  }
  .glow-frame{ animation: glowPulse 2.6s ease-in-out infinite; }

  @keyframes heartBeatIn {
    0%{ transform: scale(0.6); opacity: 0; }
    50%{ transform: scale(1.08); opacity: 1; }
    100%{ transform: scale(1); opacity: 1; }
  }
  .heartbeat-in{ animation: heartBeatIn 0.7s cubic-bezier(.34,1.56,.64,1) forwards; }

  .frost-card{
    background: rgba(255,250,246,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react,env">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ---------- tiny inline icon set (no external icon deps) ---------- */
const Icon = ({ children, size = 24, className = "", style = {} }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" className={className} style={style}>
    {children}
  </svg>
);
const HeartIcon = (props) => (
  <Icon {...props}>
    <path d="M12 21s-7.5-4.6-10.2-9.3C.2 8.7 1.6 5 5.2 4.2c2.2-.5 4.2.5 5.3 2.4l1.5 2.5 1.5-2.5c1.1-1.9 3.1-2.9 5.3-2.4 3.6.8 5 4.5 3.4 7.5C19.5 16.4 12 21 12 21z" fill="currentColor"/>
  </Icon>
);
const HeartOutlineIcon = (props) => (
  <Icon {...props}>
    <path d="M12 21s-7.5-4.6-10.2-9.3C.2 8.7 1.6 5 5.2 4.2c2.2-.5 4.2.5 5.3 2.4l1.5 2.5 1.5-2.5c1.1-1.9 3.1-2.9 5.3-2.4 3.6.8 5 4.5 3.4 7.5C19.5 16.4 12 21 12 21z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/>
  </Icon>
);
const MicIcon = (props) => (
  <Icon {...props}>
    <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor"/>
    <path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
    <path d="M12 17.5V21" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
    <path d="M8.5 21h7" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
  </Icon>
);
const StarIcon = (props) => (
  <Icon {...props}>
    <path d="M12 2.5l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 16.6 6.4 19.6l1.4-6.3-4.8-4.3 6.4-.6L12 2.5z" fill="currentColor"/>
  </Icon>
);
const NoteIcon = (props) => (
  <Icon {...props}>
    <path d="M6 3.5h9l3 3V20a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z" fill="currentColor" opacity="0.9"/>
    <path d="M8.5 9h7M8.5 12.5h7M8.5 16h4.5" stroke="#fff" strokeWidth="1" strokeLinecap="round"/>
  </Icon>
);
const LockIcon = (props) => (
  <Icon {...props}>
    <rect x="4.5" y="10.5" width="15" height="10" rx="2.2" fill="currentColor"/>
    <path d="M7.5 10.5V7.7a4.5 4.5 0 0 1 9 0v2.8" stroke="currentColor" strokeWidth="1.9" fill="none"/>
    <circle cx="12" cy="15" r="1.6" fill="#fff"/>
  </Icon>
);
const SparkleIcon = (props) => (
  <Icon {...props}>
    <path d="M12 2.5c.4 3.6 1.5 4.7 5.1 5.1-3.6.4-4.7 1.5-5.1 5.1-.4-3.6-1.5-4.7-5.1-5.1 3.6-.4 4.7-1.5 5.1-5.1z" fill="currentColor"/>
    <path d="M19 14c.2 1.8.8 2.4 2.6 2.6-1.8.2-2.4.8-2.6 2.6-.2-1.8-.8-2.4-2.6-2.6 1.8-.2 2.4-.8 2.6-2.6z" fill="currentColor"/>
  </Icon>
);
const ChevronLeft = (props) => (
  <Icon {...props}><path d="M15 5l-7 7 7 7" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" fill="none"/></Icon>
);
const ChevronRight = (props) => (
  <Icon {...props}><path d="M9 5l7 7-7 7" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" fill="none"/></Icon>
);
const KissLipsIcon = (props) => (
  <Icon {...props}>
    <path d="M4 12c1.6-2.6 4-4 8-4s6.4 1.4 8 4c-1.6.9-2.6 1.4-3.6 1.4-.9 0-1.5-.5-2.2-1-.7.6-1.4 1.4-2.2 1.4s-1.5-.8-2.2-1.4c-.7.5-1.3 1-2.2 1-1 0-2-.5-3.6-1.4z" fill="currentColor"/>
    <path d="M4 12.6c1.6 2 4 3 8 3s6.4-1 8-3c-1.6 3-4.2 5.4-8 5.4s-6.4-2.4-8-5.4z" fill="currentColor" opacity="0.75"/>
  </Icon>
);

/* ---------- floating ambient background hearts ---------- */
function AmbientHearts({ count = 14 }) {
  const hearts = useMemo(() => Array.from({ length: count }).map((_, i) => ({
    id: i,
    left: Math.random() * 100,
    size: 14 + Math.random() * 22,
    duration: 9 + Math.random() * 10,
    delay: Math.random() * 10,
    hue: Math.random() > 0.5 ? "#f2739e" : "#f6d48a",
  })), [count]);
  return (
    <div className="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
      {hearts.map(h => (
        <HeartIcon
          key={h.id}
          size={h.size}
          className="floating-heart"
          style={{
            left: `${h.left}%`,
            color: h.hue,
            animationDuration: `${h.duration}s`,
            animationDelay: `${h.delay}s`,
          }}
        />
      ))}
    </div>
  );
}

/* ---------- confetti burst ---------- */
function ConfettiBurst({ pieces = 90 }) {
  const items = useMemo(() => Array.from({ length: pieces }).map((_, i) => ({
    id: i,
    left: Math.random() * 100,
    size: 6 + Math.random() * 9,
    duration: 2.4 + Math.random() * 2.2,
    delay: Math.random() * 0.9,
    color: [ "#e8447d", "#f6d48a", "#ffffff", "#b22360", "#ff9ec3" ][i % 5],
    shape: i % 3 === 0 ? "9999px" : "3px",
  })), [pieces]);
  return (
    <div className="fixed inset-0 overflow-hidden pointer-events-none z-[60]" aria-hidden="true">
      {items.map(it => (
        <div
          key={it.id}
          style={{
            position: "absolute",
            top: 0,
            left: `${it.left}%`,
            width: it.size,
            height: it.size * 1.4,
            background: it.color,
            borderRadius: it.shape,
            animation: `confettiFall ${it.duration}s ease-in ${it.delay}s forwards`,
          }}
        />
      ))}
    </div>
  );
}

/* ================= STAGE 1: LOCKED VAULT / VOICE-MIMIC INTRO ================= */
function VaultStage({ onUnlocked }) {
  const [kisses, setKisses] = useState(0);
  const [listening, setListening] = useState(false);
  const [flashText, setFlashText] = useState(false);
  const [opening, setOpening] = useState(false);
  const [showCta, setShowCta] = useState(false);

  const handleKiss = useCallback(() => {
    if (listening || opening || kisses >= 2) return;
    setListening(true);
    setFlashText(false);
    window.setTimeout(() => {
      setListening(false);
      setFlashText(true);
      setKisses(prev => {
        const next = prev + 1;
        if (next >= 2) {
          window.setTimeout(() => setOpening(true), 650);
          window.setTimeout(() => setShowCta(true), 1500);
        }
        return next;
      });
      window.setTimeout(() => setFlashText(false), 1300);
    }, 1100);
  }, [listening, opening, kisses]);

  const onKeyActivate = (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      handleKiss();
    }
  };

  return (
    <div className="relative w-full min-h-screen flex flex-col items-center justify-center px-6 py-16 overflow-hidden">
      <AmbientHearts count={16} />

      <div className="relative z-10 flex flex-col items-center text-center max-w-xl">
        <p className="script text-3xl sm:text-4xl mb-2" style={{ color: "var(--berry-800)" }}>
          A little something for you
        </p>
        <h1 className="text-base sm:text-lg font-semibold tracking-wide mb-10" style={{ color: "var(--rose-700)" }}>
          To open this box, give it two big virtual kisses
        </h1>

        {/* the vault */}
        <div className="relative gentle-bob mb-10" style={{ perspective: "900px" }}>
          <div
            className={`relative w-56 h-56 sm:w-64 sm:h-64 rounded-[2.2rem] shadow-2xl ${opening ? "pop-scale" : ""}`}
            style={{
              background: "linear-gradient(155deg, #ff8fb3 0%, #e8447d 55%, #b22360 100%)",
              boxShadow: "0 25px 60px -15px rgba(178,35,96,0.55), inset 0 0 0 2px rgba(255,255,255,0.25)",
            }}
          >
            {/* lid */}
            <div
              className={`absolute -top-6 left-1/2 -translate-x-1/2 w-[92%] h-16 rounded-2xl ${opening ? "lid-open" : ""}`}
              style={{
                background: "linear-gradient(155deg, #ffb0cc 0%, #f2739e 60%, #d43570 100%)",
                boxShadow: "0 10px 20px -8px rgba(178,35,96,0.5), inset 0 0 0 2px rgba(255,255,255,0.3)",
                transformStyle: "preserve-3d",
              }}
            >
              <div className="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full flex items-center justify-center"
                   style={{ background: "var(--gold-300)", boxShadow: "0 4px 10px rgba(0,0,0,0.2)" }}>
                <LockIcon size={20} style={{ color: "var(--berry-800)" }} />
              </div>
            </div>

            {!opening && (
              <div className="absolute inset-0 flex items-end justify-center pb-6">
                <span className="text-xs font-semibold tracking-wide px-3 py-1 rounded-full"
                      style={{ background: "rgba(255,255,255,0.25)", color: "#fff" }}>
                  {kisses}/2 kisses given
                </span>
              </div>
            )}

            {opening && (
              <div className="absolute inset-0 flex items-center justify-center">
                {Array.from({ length: 10 }).map((_, i) => (
                  <HeartIcon
                    key={i}
                    size={16 + (i % 4) * 6}
                    className="absolute sparkle-pop"
                    style={{
                      color: i % 2 === 0 ? "#fff" : "var(--gold-300)",
                      left: `${10 + (i * 8) % 80}%`,
                      top: `${15 + (i * 13) % 70}%`,
                      animationDelay: `${i * 0.07}s`,
                    }}
                  />
                ))}
              </div>
            )}
          </div>
        </div>

        <div className="h-14 mb-2 flex items-center justify-center" aria-live="polite">
          {listening && (
            <div className="flex items-end gap-1.5 h-10">
              {[0,1,2,3,4].map(i => (
                <span
                  key={i}
                  className="wave-bar block w-2 rounded-full"
                  style={{
                    height: "100%",
                    background: "var(--rose-500)",
                    animationDuration: `${0.5 + i * 0.08}s`,
                    animationDelay: `${i * 0.06}s`,
                  }}
                />
              ))}
              <span className="ml-3 text-sm font-medium" style={{ color: "var(--rose-700)" }}>listening…</span>
            </div>
          )}
          {flashText && !listening && (
            <p className="script text-3xl sm:text-4xl heartbeat-in" style={{ color: "var(--rose-500)" }}>
              UMMMMAAAHHH! Kiss detected 💋
            </p>
          )}
        </div>

        {!showCta && (
          <button
            type="button"
            onClick={handleKiss}
            onKeyDown={onKeyActivate}
            disabled={listening || kisses >= 2}
            className="group relative flex items-center gap-3 px-7 py-4 rounded-full font-semibold text-white shadow-lg transition-transform active:scale-95 disabled:opacity-70"
            style={{ background: "linear-gradient(120deg, var(--rose-500), var(--rose-700))" }}
          >
            <span className="flex items-center justify-center w-9 h-9 rounded-full bg-white/25">
              <MicIcon size={18} />
            </span>
            {kisses === 0 ? "Say it! \u201cUmmmmaaahh\u201d" : "One more! Say it again"}
          </button>
        )}

        {showCta && (
          <button
            type="button"
            onClick={onUnlocked}
            className="fade-in flex items-center gap-2 px-8 py-4 rounded-full font-bold text-white shadow-xl transition-transform hover:scale-105 active:scale-95"
            style={{ background: "linear-gradient(120deg, var(--berry-800), var(--rose-500))" }}
          >
            Enter the Challenge to Unlock Your Surprise <SparkleIcon size={18} />
          </button>
        )}
      </div>
    </div>
  );
}

/* ================= STAGE 2: CATCH-THE-LOVE GAME ================= */
const TARGET_SCORE = 10;
const FALL_TYPES = [
  { kind: "heart", weight: 3 },
  { kind: "star", weight: 2 },
  { kind: "note", weight: 1 },
];

function pickKind() {
  const total = FALL_TYPES.reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  for (const t of FALL_TYPES) {
    if (r < t.weight) return t.kind;
    r -= t.weight;
  }
  return "heart";
}

function FallingIcon({ kind, size }) {
  const style = { color: kind === "heart" ? "var(--rose-500)" : kind === "star" ? "var(--gold-300)" : "var(--berry-800)" };
  if (kind === "heart") return <HeartIcon size={size} style={style} />;
  if (kind === "star") return <StarIcon size={size} style={style} />;
  return <NoteIcon size={size} style={style} />;
}

function GameStage({ onWin }) {
  const arenaRef = useRef(null);
  const basketXRef = useRef(50); // percentage, 0-100
  const [basketX, setBasketX] = useState(50);
  const [score, setScore] = useState(0);
  const [items, setItems] = useState([]);
  const [pops, setPops] = useState([]);
  const idCounter = useRef(0);
  const scoreRef = useRef(0);
  const keysDown = useRef({ left: false, right: false });
  const gameOver = score >= TARGET_SCORE;

  useEffect(() => {
    scoreRef.current = score;
  }, [score]);

  // spawn loop — stops once the target is reached
  useEffect(() => {
    if (gameOver) return;
    const spawn = () => {
      idCounter.current += 1;
      const kind = pickKind();
      const left = 8 + Math.random() * 84; // percent across arena width
      const speed = 78 + Math.random() * 42; // px per second, fair & catchable
      const size = 30 + Math.random() * 14;
      setItems(prev => [...prev, { id: idCounter.current, kind, left, top: -40, size, speed }]);
    };
    spawn();
    const interval = window.setInterval(spawn, 750);
    return () => window.clearInterval(interval);
  }, [gameOver]);

  // pointer / mouse control
  useEffect(() => {
    const handleMove = (clientX) => {
      if (!arenaRef.current) return;
      const rect = arenaRef.current.getBoundingClientRect();
      let pct = ((clientX - rect.left) / rect.width) * 100;
      pct = Math.max(6, Math.min(94, pct));
      basketXRef.current = pct;
      setBasketX(pct);
    };
    const onMouseMove = (e) => handleMove(e.clientX);
    const onTouchMove = (e) => {
      if (e.touches && e.touches[0]) handleMove(e.touches[0].clientX);
    };
    const el = arenaRef.current;
    if (el) {
      el.addEventListener("mousemove", onMouseMove);
      el.addEventListener("touchmove", onTouchMove, { passive: true });
    }
    return () => {
      if (el) {
        el.removeEventListener("mousemove", onMouseMove);
        el.removeEventListener("touchmove", onTouchMove);
      }
    };
  }, []);

  // keyboard control (continuous nudge while a key is held)
  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key === "ArrowLeft") keysDown.current.left = true;
      if (e.key === "ArrowRight") keysDown.current.right = true;
    };
    const onKeyUp = (e) => {
      if (e.key === "ArrowLeft") keysDown.current.left = false;
      if (e.key === "ArrowRight") keysDown.current.right = false;
    };
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    return () => {
      window.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("keyup", onKeyUp);
    };
  }, []);

  const nudge = (dir) => {
    basketXRef.current = Math.max(6, Math.min(94, basketXRef.current + dir * 8));
    setBasketX(basketXRef.current);
  };

  // single source of truth for motion + collisions: one requestAnimationFrame loop
  // drives both the falling items' pixel position AND the catch check, so what you
  // see is exactly what gets scored (no drift between CSS animation and JS math).
  useEffect(() => {
    let rafId;
    let lastTime = performance.now();

    const loop = (now) => {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      if (keysDown.current.left) {
        basketXRef.current = Math.max(6, basketXRef.current - 55 * dt);
        setBasketX(basketXRef.current);
      }
      if (keysDown.current.right) {
        basketXRef.current = Math.min(94, basketXRef.current + 55 * dt);
        setBasketX(basketXRef.current);
      }

      const arena = arenaRef.current;
      if (arena && scoreRef.current < TARGET_SCORE) {
        const rect = arena.getBoundingClientRect();
        const basketPxX = (basketXRef.current / 100) * rect.width;
        const basketTop = rect.height - 16 - 44; // matches bottom-4 offset + basket height
        const basketBottom = rect.height - 12;
        const catchHalfWidth = 44;

        setItems(prevItems => {
          if (prevItems.length === 0) return prevItems;
          let gained = 0;
          const newPops = [];
          const survivors = [];
          for (const it of prevItems) {
            const newTop = it.top + it.speed * dt;
            const itemCenterY = newTop + it.size / 2;
            const itemPxX = (it.left / 100) * rect.width;
            const withinX = Math.abs(itemPxX - basketPxX) < catchHalfWidth;
            const withinY = itemCenterY >= basketTop && itemCenterY <= basketBottom;

            if (withinX && withinY) {
              gained += 1;
              newPops.push({ id: `${it.id}-${now}-${Math.random().toString(36).slice(2, 7)}`, x: itemPxX, y: newTop });
              continue; // caught — remove from play
            }
            if (newTop > rect.height + 60) {
              continue; // missed — fell past the basket
            }
            survivors.push({ ...it, top: newTop });
          }
          if (gained > 0) {
            setScore(s => Math.min(TARGET_SCORE, s + gained));
          }
          if (newPops.length > 0) {
            setPops(p => [...p, ...newPops]);
            newPops.forEach(np => {
              window.setTimeout(() => setPops(p => p.filter(pp => pp.id !== np.id)), 650);
            });
          }
          return survivors;
        });
      }

      rafId = requestAnimationFrame(loop);
    };

    rafId = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafId);
  }, []);

  useEffect(() => {
    if (score >= TARGET_SCORE) {
      const t = window.setTimeout(onWin, 500);
      return () => window.clearTimeout(t);
    }
  }, [score, onWin]);

  const progressPct = Math.min(100, (score / TARGET_SCORE) * 100);

  return (
    <div className="relative w-full min-h-screen flex flex-col items-center px-4 py-6 sm:py-10 overflow-hidden">
      <AmbientHearts count={8} />

      <div className="relative z-10 w-full max-w-2xl flex flex-col items-center">
        <p className="script text-2xl sm:text-3xl mb-1" style={{ color: "var(--berry-800)" }}>Catch the Love</p>
        <p className="text-sm sm:text-base font-medium mb-4 text-center" style={{ color: "var(--rose-700)" }}>
          Move your basket and catch {TARGET_SCORE} hearts to unlock your surprise
        </p>

        {/* love meter */}
        <div className="w-full max-w-md mb-5">
          <div className="flex justify-between text-xs font-semibold mb-1" style={{ color: "var(--berry-800)" }}>
            <span>Love Meter</span>
            <span>{score} / {TARGET_SCORE}</span>
          </div>
          <div className="w-full h-4 rounded-full overflow-hidden" style={{ background: "rgba(178,35,96,0.18)" }}>
            <div
              className="h-full rounded-full transition-all duration-300 ease-out"
              style={{ width: `${progressPct}%`, background: "linear-gradient(90deg, var(--rose-400), var(--rose-700))" }}
            />
          </div>
        </div>

        {/* arena */}
        <div
          ref={arenaRef}
          className="relative w-full rounded-3xl overflow-hidden select-none frost-card"
          style={{
            height: "min(58vh, 460px)",
            boxShadow: "0 20px 45px -18px rgba(178,35,96,0.4), inset 0 0 0 2px rgba(255,255,255,0.5)",
            cursor: "none",
            touchAction: "none",
          }}
        >
          {items.map(it => (
            <div
              key={it.id}
              className="absolute"
              style={{
                left: `${it.left}%`,
                top: `${it.top}px`,
                transform: "translateX(-50%)",
              }}
            >
              <FallingIcon kind={it.kind} size={it.size} />
            </div>
          ))}

          {pops.map(p => (
            <div key={p.id} className="absolute sparkle-pop pointer-events-none" style={{ left: p.x, top: p.y, transform: "translate(-50%,-50%)" }}>
              <SparkleIcon size={30} style={{ color: "var(--gold-300)" }} />
            </div>
          ))}

          {/* basket */}
          <div
            className="absolute bottom-4 flex items-center justify-center transition-none"
            style={{
              left: `${basketX}%`,
              transform: "translateX(-50%)",
              width: 72,
              height: 46,
            }}
          >
            <div
              className="w-full h-full rounded-b-3xl rounded-t-xl flex items-center justify-center"
              style={{
                background: "linear-gradient(160deg, var(--gold-300), var(--rose-500))",
                boxShadow: "0 10px 20px -8px rgba(178,35,96,0.55)",
              }}
            >
              <HeartIcon size={22} style={{ color: "#fff" }} />
            </div>
          </div>
        </div>

        {/* mobile controls */}
        <div className="flex sm:hidden gap-6 mt-5">
          <button
            type="button"
            onTouchStart={(e) => { e.preventDefault(); nudge(-1); }}
            onClick={() => nudge(-1)}
            className="w-14 h-14 rounded-full flex items-center justify-center text-white shadow-lg active:scale-90"
            style={{ background: "var(--rose-500)" }}
            aria-label="Move basket left"
          >
            <ChevronLeft size={26} />
          </button>
          <button
            type="button"
            onTouchStart={(e) => { e.preventDefault(); nudge(1); }}
            onClick={() => nudge(1)}
            className="w-14 h-14 rounded-full flex items-center justify-center text-white shadow-lg active:scale-90"
            style={{ background: "var(--rose-500)" }}
            aria-label="Move basket right"
          >
            <ChevronRight size={26} />
          </button>
        </div>
        <p className="hidden sm:block text-xs mt-4 font-medium" style={{ color: "var(--rose-700)" }}>
          Move your mouse, or use the arrow keys ←  →
        </p>
      </div>
    </div>
  );
}

/* ================= STAGE 3: WIN TRANSITION + ZOOM KISS ================= */
// The glossy red kiss mark — the real 💋 glyph, rendered large — pops in
// with a pucker bounce, then rushes at the screen and zooms up to fill it
// entirely before handing off to the photo finale.
function GlossyKissMark({ size = 200 }) {
  return (
    <span
      role="img"
      aria-label="kiss mark"
      style={{
        fontSize: size,
        lineHeight: 1,
        display: "inline-block",
        filter: "drop-shadow(0 18px 32px rgba(74,15,45,0.45))",
      }}
    >
      💋
    </span>
  );
}

function WinTransition({ onZoomDone }) {
  const [phase, setPhase] = useState("intro"); // intro -> kiss -> zoom

  useEffect(() => {
    const t = window.setTimeout(() => setPhase("kiss"), 1100);
    return () => window.clearTimeout(t);
  }, []);

  useEffect(() => {
    let t;
    if (phase === "kiss") t = window.setTimeout(() => setPhase("zoom"), 1050);
    if (phase === "zoom") t = window.setTimeout(onZoomDone, 1650);
    return () => window.clearTimeout(t);
  }, [phase, onZoomDone]);

  const showKiss = phase === "kiss" || phase === "zoom";
  const zooming = phase === "zoom";

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center overflow-hidden"
         style={{ background: "radial-gradient(ellipse at center, #ffe4ea 0%, #f2739e 60%, #b22360 100%)" }}>
      <ConfettiBurst pieces={110} />

      {phase === "intro" && (
        <div className="relative z-10 text-center px-6 heartbeat-in">
          <p className="script text-5xl sm:text-6xl mb-2" style={{ color: "var(--berry-800)" }}>You won!</p>
          <p className="text-base sm:text-lg font-semibold" style={{ color: "var(--rose-700)" }}>
            Love meter fully charged 💗
          </p>
        </div>
      )}

      {showKiss && (
        <div className="relative z-10 flex items-center justify-center" style={{ width: 240, height: 240 }}>
          <div
            style={{
              animation: zooming ? "zoomKiss 1.65s cubic-bezier(.61,.04,.76,.34) forwards" : "lipPucker 0.85s cubic-bezier(.34,1.56,.64,1) forwards",
            }}
          >
            <GlossyKissMark size={170} />
          </div>

          {!zooming &&
            Array.from({ length: 8 }).map((_, i) => (
              <SparkleIcon
                key={i}
                size={14 + (i % 3) * 5}
                className="absolute sparkle-pop"
                style={{
                  color: i % 2 === 0 ? "#fff" : "var(--gold-300)",
                  top: "50%",
                  left: "50%",
                  transform: `translate(${Math.cos((i / 8) * Math.PI * 2) * 100}px, ${Math.sin((i / 8) * Math.PI * 2) * 100}px)`,
                  animationDelay: `${0.35 + i * 0.05}s`,
                }}
              />
            ))}
        </div>
      )}
    </div>
  );
}

function FinaleStage({ photoSrc }) {
  return (
    <div className="relative w-full min-h-screen flex flex-col items-center justify-center px-6 py-16 overflow-hidden">
      <AmbientHearts count={18} />

      <div className="relative z-10 flex flex-col items-center text-center max-w-md fade-in">
        <div
          className="glow-frame rounded-[1.8rem] p-2 mb-8"
          style={{ background: "linear-gradient(155deg, #fff, var(--gold-300))" }}
        >
          <div className="rounded-[1.5rem] overflow-hidden" style={{ width: "min(78vw, 300px)" }}>
            <img
              src={photoSrc}

        <div className="frost-card rounded-3xl px-8 py-6 shadow-xl heartbeat-in" style={{ animationDelay: "0.3s", opacity: 0, animationFillMode: "forwards" }}>
          <p className="script text-4xl sm:text-5xl" style={{ color: "var(--rose-500)" }}>

  );
}

  const [stage, setStage] = useState("vault"); // vault -> game -> winTransition -> finale

  return (
    <div className="relative w-full min-h-screen">
